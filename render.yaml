services:
  - type: web
    name: lori-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FIRM_NAME
        value: Tanya Freeman Law LLC
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-minilm-l6-v2
      - key: EMBEDDING_VECTOR_SIZE
        value: "384"
      - key: QDRANT_COLLECTION
        value: lori_v3
