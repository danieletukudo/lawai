services:
  - type: web
    name: lori-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: FIRM_NAME
        value: Tanya Freeman Law LLC
